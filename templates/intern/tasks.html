{% extends 'base.html' %}
{% load static %}

{% block title %}My Tasks - Intern{% endblock %}

{% block content %}
<h3 class="mb-4" style="font-weight: 700;">
    <i class="fas fa-tasks text-primary"></i> My Tasks
</h3>

<div class="card mb-4">
    <div class="card-body">
        <div class="row g-2">
            <div class="col-md-4">
                <select class="form-select" id="statusFilter">
                    <option value="">All Status</option>
                    <option value="assigned">Assigned</option>
                    <option value="in_progress">In Progress</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <div class="col-md-4">
                <select class="form-select" id="priorityFilter">
                    <option value="">All Priority</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                    <option value="critical">Critical</option>
                </select>
            </div>
            <div class="col-md-4">
                <button class="btn btn-primary w-100" id="refreshBtn">
                    <i class="fas fa-sync"></i> Refresh
                </button>
            </div>
        </div>
    </div>
</div>

<div class="row g-3" id="tasksGrid">
    <div class="col-12 text-center text-muted py-5">
        <div class="spinner-border"></div>
        <p class="mt-2">Loading tasks...</p>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/intern-tasks.css' %}?v={% now 'U' %}">
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/intern-tasks.js' %}?v={% now 'U' %}"></script>
{% endblock %}
