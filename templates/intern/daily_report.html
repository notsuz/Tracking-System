{% extends 'base.html' %}

{% block title %}Daily Reports - Intern{% endblock %}

{% block content %}
<h3 class="mb-4" style="font-weight: 700;"><i class="fas fa-file-alt text-primary"></i> Daily Reports</h3>

<div class="card">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Duration</th>
                        <th>Break</th>
                        <th>Working Time</th>
                        <th>Summary</th>
                    </tr>
                </thead>
                <tbody id="reportBody">
                    <tr><td colspan="5" class="text-center text-muted py-4">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const token = getToken();

$.ajax({
    url: '/api/attendance/history/',
    method: 'GET',
    headers: { 'Authorization': 'Bearer ' + token },
    success: function(data) {
        const items = (data.results || data || []).filter(s => s.status !== 'active');
        if (!items.length) {
            document.getElementById('reportBody').innerHTML =
                '<tr><td colspan="5" class="empty-state"><i class="fas fa-file-alt"></i><p class="mb-0">No completed sessions yet</p></td></tr>';
            return;
        }
        let html = '';
        items.forEach(s => {
            const summary = s.daily_summary || '<em class="text-muted">No summary provided</em>';
            html += `
                <tr>
                    <td><strong>${s.date}</strong></td>
                    <td>${(s.duration || '--:--').substring(0,8)}</td>
                    <td>${(s.total_break_time || '--:--').substring(0,8)}</td>
                    <td>${(s.working_time || '--:--').substring(0,8)}</td>
                    <td style="max-width: 400px;">${summary}</td>
                </tr>
            `;
        });
        document.getElementById('reportBody').innerHTML = html;
    }
});
</script>
{% endblock %}
