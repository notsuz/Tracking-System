{% extends 'base.html' %}
{% load static %}

{% block title %}Reports - Team Lead{% endblock %}

{% block content %}
<h3 class="mb-4" style="font-weight: 700;">
    <i class="fas fa-chart-bar text-primary"></i> Reports
</h3>

<div class="card mb-4">
    <div class="card-body">
        <div class="row g-2">
            <div class="col-md-5">
                <label class="form-label">Date</label>
                <input type="date" class="form-control" id="reportDate">
            </div>
            <div class="col-md-5">
                <label class="form-label">&nbsp;</label>
                <button class="btn btn-primary w-100" onclick="loadReport()">
                    <i class="fas fa-file-alt"></i> Generate Report
                </button>
            </div>
        </div>
    </div>
</div>

<div id="reportContent">
    <div class="text-center text-muted py-5">
        <i class="fas fa-chart-bar" style="font-size: 3rem; opacity: 0.4;"></i>
        <p class="mt-3">Select a date and click generate to view report</p>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/lead-reports.css' %}?v={% now 'U' %}">
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/lead-reports.js' %}?v={% now 'U' %}"></script>
{% endblock %}
