{% extends 'base.html' %}
{% load static %}

{% block title %}Assign Task - Team Lead{% endblock %}

{% block content %}
<h3 class="mb-4" style="font-weight: 700;">
    <i class="fas fa-plus-circle text-primary"></i> Assign New Task
</h3>

<div class="row g-3">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-body">
                <div id="messageContainer"></div>

                <form id="taskForm">
                    <div class="mb-3">
                        <label class="form-label">
                            Assign To <span class="text-danger">*</span>
                        </label>
                        <select class="form-select" id="assignedTo" required>
                            <option value="">Loading interns...</option>
                        </select>
                        <div class="form-text">
                            Select an intern by their username.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Task Title <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="title" required
                               placeholder="e.g., Build Login API">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Description <span class="text-danger">*</span>
                        </label>
                        <textarea class="form-control" id="description" rows="5" required
                                  placeholder="Describe what needs to be done..."></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Priority</label>
                            <select class="form-select" id="priority">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                                <option value="critical">Critical</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Deadline</label>
                            <input type="datetime-local" class="form-control" id="deadline">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
                        <i class="fas fa-check"></i> Assign Task
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-lg-4">
        <div class="card">
            <div class="card-header">
                <h6 class="mb-0"><i class="fas fa-users text-primary"></i> Team Snapshot</h6>
            </div>
            <div class="card-body">
                <div class="d-flex justify-content-between mb-2">
                    <span>Total Interns</span>
                    <strong id="totalInterns">0</strong>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span><span class="status-indicator online"></span> Online</span>
                    <strong id="onlineInterns">0</strong>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span><span class="status-indicator on_break"></span> On Break</span>
                    <strong id="breakInterns">0</strong>
                </div>
                <div class="d-flex justify-content-between">
                    <span><span class="status-indicator offline"></span> Offline</span>
                    <strong id="offlineInterns">0</strong>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/lead-assign-task.js' %}"></script>
{% endblock %}
